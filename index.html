<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10172b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Daymark"><title>Daymark — make time visible</title><meta name="description" content="Private event countdowns, birthdays, experience timelines and date calculators."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside class="sidebar"><div class="brand"><span class="brandmark">◷</span><span>daymark</span></div><div class="side-label">WORKSPACE</div><nav aria-label="Main navigation"><button class="nav active" data-view="overview">◫ <span>Overview</span></button><button class="nav" data-view="events">◷ <span>All events</span></button><button class="nav" data-view="timeline">▥ <span>Timeline</span></button><button class="nav" data-view="calculator">⌁ <span>Calculators</span></button><button class="nav" data-view="settings">⚙ <span>Data & settings</span></button></nav><div class="side-bottom"><span class="privacy-dot"></span> Your data stays on this device</div></aside><main class="main"><header><div><div class="eyebrow" id="todayLabel"></div><h1 id="pageTitle">Your time, at a glance<span class="accent">.</span></h1></div><button class="primary" id="addTop">＋ <span>New counter</span></button></header><section id="content"></section></main></div><nav class="mobile-nav" aria-label="Mobile navigation"><button data-view="overview">◫<small>Home</small></button><button data-view="events">◷<small>Events</small></button><button data-view="timeline">▥<small>Timeline</small></button><button data-view="calculator">⌁<small>Calculate</small></button><button data-view="settings">⚙<small>Data</small></button></nav><dialog id="editor"><form method="dialog" id="eventForm"><div class="dialog-head"><div><div class="eyebrow">MAKE IT COUNT</div><h2 id="editorTitle">New counter</h2></div><button class="icon-btn" type="button" id="closeEditor" aria-label="Close">×</button></div><input type="hidden" name="id"><label>Name<input name="title" maxlength="90" required placeholder="e.g. Ayush's birthday"></label><div class="form-grid"><label>Type<select name="type"><option value="event">Event / countdown</option><option value="birthday">Birthday</option><option value="job">Job / experience</option><option value="goal">Goal / progress</option><option value="anniversary">Anniversary</option><option value="todo">Task / deadline</option></select></label><label>Color<select name="color"><option value="blue">Ocean blue</option><option value="purple">Violet</option><option value="orange">Sunset</option><option value="green">Emerald</option><option value="pink">Rose</option></select></label></div><div class="form-grid"><label>Start / birth date<input name="start" type="datetime-local" required></label><label>End / event date<input name="end" type="datetime-local"></label></div><p class="hint">For birthdays and anniversaries, enter the original date. The next occurrence is calculated each year. For an ongoing job, leave the end date blank.</p><div class="form-grid"><label>Repeat<select name="repeat"><option value="none">No repeat</option><option value="yearly">Every year</option><option value="monthly">Every month</option><option value="weekly">Every week</option></select></label><label>Show as<select name="unit"><option value="auto">Smart units</option><option value="days">Days</option><option value="hours">Hours</option><option value="minutes">Minutes</option></select></label></div><label>Notes<textarea name="notes" rows="2" maxlength="500" placeholder="A little context, if you like"></textarea></label><div class="dialog-actions"><button type="button" class="secondary danger" id="deleteEvent" hidden>Delete</button><div class="spacer"></div><button type="button" class="secondary" id="cancelEditor">Cancel</button><button class="primary" type="submit">Save counter</button></div></form></dialog><input id="importFile" type="file" accept=".json,application/json" hidden><div id="toast" role="status" aria-live="polite"></div><script src="app.js" defer></script></body></html>
